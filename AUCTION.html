<!DOCTYPE html>
<html>
<head>
  <title>BAGWAN PREMIER LEAGUE | Official Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts for Professional Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 🌟 ENTERPRISE GRADE PROFESSIONAL DESIGN 🌟 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f5f7fb;
      background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.03) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(212, 175, 55, 0.03) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 780px;
      width: 100%;
      margin: 20px auto;
      background: white;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    .form-header {
      background: linear-gradient(135deg, #0a1c2f 0%, #0e2a3b 100%);
      color: white;
      padding: 35px 40px 30px;
      border-radius: 28px 28px 0 0;
      position: relative;
      overflow: hidden;
    }

    .form-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .form-header::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: -10%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title i {
      color: #d4af37;
      font-size: 32px;
    }

    .header-subtitle {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.9;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      border-left: 4px solid #d4af37;
      padding-left: 12px;
      margin-top: 5px;
    }

    .header-badge {
      position: absolute;
      top: 30px;
      right: 40px;
      background: rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(5px);
      padding: 8px 18px;
      border-radius: 60px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #d4af37;
      letter-spacing: 1px;
    }

    .form-body {
      padding: 35px 40px 40px;
      background: white;
      border-radius: 0 0 28px 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0a1c2f;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 25px 0 20px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f4f8;
      position: relative;
    }

    .section-title i {
      color: #d4af37;
      font-size: 20px;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-group {
      margin-bottom: 5px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: #33475b;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      font-size: 16px;
      transition: all 0.2s;
    }

    input[type=text], 
    input[type=number], 
    input[type=email], 
    input[type=date], 
    input[type=file] {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: #f8fafd;
      border: 1.5px solid #e6edf4;
      border-radius: 14px;
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.02, 0.81, 0.32, 0.99);
      font-size: 15px;
      color: #0a1c2f;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
    }

    input[type=date] {
      padding: 13px 16px 13px 48px;
    }

    input[type=file] {
      padding: 12px 16px 12px 48px;
      background: #f8fafd;
    }

    input[type=text]:hover, 
    input[type=number]:hover, 
    input[type=email]:hover, 
    input[type=date]:hover {
      border-color: #cbd5e1;
      background: white;
    }

    input[type=text]:focus, 
    input[type=number]:focus, 
    input[type=email]:focus, 
    input[type=date]:focus {
      border-color: #d4af37;
      background: white;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08);
      outline: none;
    }

    input[type=file]:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08);
      outline: none;
    }

    .checkbox-section {
      background: #f8fafd;
      padding: 24px;
      border-radius: 20px;
      border: 1.5px solid #e6edf4;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .checkbox-section:hover {
      border-color: #d4af37;
      background: white;
    }

    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 12px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 10px 18px;
      border-radius: 40px;
      border: 1.5px solid #e6edf4;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .checkbox-item:hover {
      border-color: #d4af37;
      background: #fefcf5;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -10px rgba(212, 175, 55, 0.2);
    }

    .checkbox-item input[type=checkbox] {
      width: 18px;
      height: 18px;
      accent-color: #d4af37;
      cursor: pointer;
      margin: 0;
    }

    .checkbox-item label {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      color: #2c3e50;
      text-transform: none;
      cursor: pointer;
    }

    .photo-upload-area {
      background: #f8fafd;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .photo-upload-area:hover {
      border-color: #d4af37;
      background: #fefcf5;
    }

    .photo-upload-area i {
      font-size: 36px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .photo-upload-area .upload-text {
      font-weight: 600;
      color: #0a1c2f;
      margin-bottom: 5px;
    }

    .photo-upload-area .upload-hint {
      font-size: 12px;
      color: #64748b;
    }

    #preview {
      max-width: 120px;
      max-height: 120px;
      margin: 15px auto 0;
      display: none;
      border-radius: 16px;
      border: 4px solid #d4af37;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      object-fit: cover;
    }

    .button-group {
      margin-top: 45px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0a1c2f, #0e2a3b);
      color: white;
      font-size: 18px;
      font-weight: 700;
      padding: 18px 28px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      letter-spacing: 1.5px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 10px 20px -8px rgba(10, 28, 47, 0.3);
    }

    .btn-primary i {
      font-size: 20px;
      color: #d4af37;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0e2a3b, #123546);
      transform: translateY(-3px);
      box-shadow: 0 20px 30px -8px rgba(10, 28, 47, 0.4);
      border-color: #d4af37;
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      transform: none;
      cursor: not-allowed;
    }

    .message {
      padding: 16px 20px;
      margin-bottom: 25px;
      border-radius: 16px;
      display: none;
      font-weight: 600;
      text-align: center;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .success {
      background: #eaf9ed;
      color: #1e7b4c;
      border: 1px solid #b8e0c2;
    }

    .error {
      background: #fee9e7;
      color: #b33a3a;
      border: 1px solid #fbc5c5;
    }

    .footer-note {
      text-align: center;
      margin-top: 30px;
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1px;
      border-top: 1px solid #e6edf4;
      padding-top: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .footer-note span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-note i {
      color: #d4af37;
      font-size: 12px;
    }

    /* Custom date input style */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.5;
      cursor: pointer;
      padding: 5px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 15px; }
      .form-header { padding: 25px; }
      .form-body { padding: 25px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      .header-badge { position: relative; top: 0; right: 0; margin-top: 15px; width: fit-content; }
      .checkbox-grid { gap: 12px; }
      .checkbox-item { width: 100%; }
    }

    /* Loading animation */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .loading {
      animation: shimmer 2s infinite linear;
      background: linear-gradient(to right, #f8fafd 4%, #edf2f7 25%, #f8fafd 36%);
      background-size: 1000px 100%;
    }

    /* Print styles */
    @media print {
      body { background: white; }
      .container { box-shadow: none; }
      .btn-primary { display: none; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ENTERPRISE HEADER -->
  <div class="form-header">
    <div class="header-title">
      <i class="fas fa-trophy"></i> BAGWAN PREMIER LEAGUE
    </div>
    <div class="header-subtitle">
     BAGWAN PREMIER LEAGUE SEASON 5
    </div>
<div class="header-subtitle">
    AUCTION FORM
    </div>
    <div class="header-badge">
      <i class="fas fa-shield-alt"></i> OFFICIAL REGISTRATION
    </div>
  </div>

  <!-- FORM BODY -->
  <div class="form-body">
    <div id="messageBox" class="message"></div>

    <form id="cricketForm">
      <!-- SECTION 1: PLAYER PHOTO -->
      <div class="section-title">
        <i class="fas fa-camera"></i> PLAYER PHOTOGRAPH
      </div>
      
      <div class="photo-upload-area" onclick="document.getElementById('photoInput').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="upload-text">Click to upload player photo</div>
        <div class="upload-hint">Supported: JPG, PNG (Max 5MB)</div>
        <input type="file" id="photoInput" accept="image/*" required style="display: none;">
        <img id="preview" alt="Player photograph">
      </div>

      <!-- SECTION 2: PERSONAL DETAILS -->
      <div class="section-title">
        <i class="fas fa-user-circle"></i> PERSONAL DETAILS
      </div>
      
      <div class="form-grid">
        <div class="form-group full-width">
          <label>FULL NAME</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" name="name" placeholder="As per Aadhaar card" required>
          </div>
        </div>

        <div class="form-group">
          <label>DATE OF BIRTH</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar-alt input-icon"></i>
            <input type="date" name="dob" required>
          </div>
        </div>

        <div class="form-group">
          <label>AGE</label>
          <div class="input-wrapper">
            <i class="fas fa-birthday-cake input-icon"></i>
            <input type="number" name="age" placeholder="Years">
          </div>
        </div>

        <div class="form-group">
          <label>CONTACT NUMBER</label>
          <div class="input-wrapper">
            <i class="fas fa-phone-alt input-icon"></i>
            <input type="text" name="contact" placeholder="10-digit mobile" required>
          </div>
        </div>

        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" name="email" placeholder="player@example.com" required>
          </div>
        </div>

        <div class="form-group full-width">
          <label>AADHAAR CARD NUMBER</label>
          <div class="input-wrapper">
            <i class="fas fa-id-card input-icon"></i>
            <input type="text" name="aadhaar" placeholder="XXXX XXXX XXXX" required>
          </div>
        </div>

        <div class="form-group full-width">
          <label>RESIDENCE</label>
          <div class="input-wrapper">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <input type="text" name="residence" placeholder="City, State">
          </div>
        </div>
      </div>

      <!-- SECTION 3: PLAYING DETAILS -->
      <div class="section-title">
        <i class="fas fa-cricket"></i> PLAYING DETAILS
      </div>
      
      <div class="checkbox-section">
        <label style="margin-bottom: 5px; color: #0a1c2f;">BATTING STYLE</label>
        <div class="checkbox-grid">
          <div class="checkbox-item">
            <input type="checkbox" name="batterRHB">
            <label>RIGHT HANDED</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="batterLHB">
            <label>LEFT HANDED</label>
          </div>
        </div>
      </div>

      <div class="checkbox-section" style="margin-top: 20px;">
        <label style="margin-bottom: 5px; color: #0a1c2f;">BOWLING STYLE</label>
        <div class="checkbox-grid">
          <div class="checkbox-item">
            <input type="checkbox" name="bowlerRHB">
            <label>RIGHT HAND</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="bowlerLHB">
            <label>LEFT HAND</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="mediumPacer">
            <label>MEDIUM PACER</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="spinner">
            <label>SPINNER</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="offSpinner">
            <label>OFF SPIN</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="legSpinner">
            <label>LEG SPIN</label>
          </div>
        </div>
      </div>

      <div class="checkbox-section" style="margin-top: 20px;">
        <label style="margin-bottom: 5px; color: #0a1c2f;">ADDITIONAL ROLE</label>
        <div class="checkbox-grid">
          <div class="checkbox-item">
            <input type="checkbox" name="allRounder">
            <label>ALL-ROUNDER</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" name="wicketKeeper">
            <label>WICKET KEEPER</label>
          </div>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <div class="button-group">
        <button type="submit" class="btn-primary">
          <i class="fas fa-check-circle"></i> REGISTER PLAYER
        </button>
      </div>

      <!-- FOOTER -->
      <div class="footer-note">
        <span><i class="fas fa-shield"></i> Verified Registration</span>
        <span><i class="fas fa-clock"></i> BAGWAN PREMIER LEAGUE</span>
        <span><i class="fas fa-lock"></i> Secure Data</span>
      </div>
    </form>
  </div>
</div>

<script>
// 📸 Photo preview
document.getElementById('photoInput').onchange = function(e) {
  const file = e.target.files[0];
  if (file) {
    // Validate file size (5MB)
    if (file.size > 5 * 1024 * 1024) {
      alert('File size must be less than 5MB');
      this.value = '';
      return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const preview = document.getElementById('preview');
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
};

// 📤 Form submit with duplicate check
document.getElementById('cricketForm').onsubmit = async function(e) {
  e.preventDefault();
  
  const messageBox = document.getElementById('messageBox');
  const submitBtn = this.querySelector('button[type="submit"]');
  
  // Disable button
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PROCESSING...';
  
  // Photo convert to Base64
  const photoFile = document.getElementById('photoInput').files[0];
  let photoData = '';
  let photoType = '';
  let photoName = '';
  
  if (photoFile) {
    photoData = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(photoFile);
    });
    photoType = photoFile.type;
    photoName = photoFile.name;
  }
  
  const formData = {
    name: this.name.value,
    dob: this.dob.value,
    contact: this.contact.value,
    aadhaar: this.aadhaar.value,
    residence: this.residence.value,
    age: this.age.value,
    batterRHB: this.batterRHB.checked ? "Yes" : "No",
    batterLHB: this.batterLHB.checked ? "Yes" : "No",
    bowlerRHB: this.bowlerRHB.checked ? "Yes" : "No",
    bowlerLHB: this.bowlerLHB.checked ? "Yes" : "No",
    mediumPacer: this.mediumPacer.checked ? "Yes" : "No",
    spinner: this.spinner.checked ? "Yes" : "No",
    offSpinner: this.offSpinner.checked ? "Yes" : "No",
    legSpinner: this.legSpinner.checked ? "Yes" : "No",
    allRounder: this.allRounder.checked ? "Yes" : "No",
    wicketKeeper: this.wicketKeeper.checked ? "Yes" : "No",
    email: this.email.value,
    photoData: photoData,
    photoType: photoType,
    photoName: photoName
  };

  try {
    // 🟢🟢🟢 AAPKA DEPLOY URL YAHAN PASTE KIYA GAYA HAI 🟢🟢🟢
    const response = await fetch('https://script.google.com/macros/s/AKfycbwz-20u1jWYxt_WiMgMnZdjS9ebQGcZus56zp7yUlcF_muWfgk9D3lnmG3DNlu2Vtzj/exec', {
      method: 'POST',
      body: JSON.stringify(formData)
    });
    
    const result = await response.json();
    
    if (result.status === 'duplicate') {
      messageBox.className = 'message error';
      messageBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + result.message;
      messageBox.style.display = 'flex';
    } else {
      messageBox.className = 'message success';
      messageBox.innerHTML = '<i class="fas fa-check-circle"></i> REGISTRATION SUCCESSFUL • CONFIRMATION SENT';
      messageBox.style.display = 'flex';
      this.reset();
      document.getElementById('preview').style.display = 'none';
    }
  } catch (error) {
    messageBox.className = 'message error';
    messageBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> CONNECTION ERROR • PLEASE TRY AGAIN';
    messageBox.style.display = 'flex';
  }
  
  // Enable button
  submitBtn.disabled = false;
  submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> REGISTER PLAYER';
};
</script>

</body>
</html>
